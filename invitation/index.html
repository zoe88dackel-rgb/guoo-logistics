<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f7fc">
  <meta name="description" content="填写受邀人或公司名称，预览并保存专属邀请函。">
  <title>邀请函生成器 · 国欧物流 / 国贸集团</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="stylesheet" href="./style-v3.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="./" aria-label="邀请函生成器首页">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>邀请函生成器<span class="brand-divider">/</span><span class="brand-title">满洲里 · 2026</span></span>
      </a>
      <span class="header-note">一份邀请，一份心意</span>
    </header>

    <main class="workspace">
      <section class="editor" aria-labelledby="page-title">
        <div class="eyebrow"><span></span>2026 · 满洲里</div>
        <h1 id="page-title">制作专属<span>邀请函</span></h1>
        <p class="intro">填写受邀人或公司名称，<br>把这份邀请送给重要的伙伴。</p>

        <form id="invitation-form" novalidate>
          <fieldset id="issuer-options" class="issuer-options">
            <legend>邀约方</legend>
            <div class="mode-switch">
              <label><input type="radio" name="issuer" value="guoo" checked><span>国欧物流</span></label>
              <label><input type="radio" name="issuer" value="guomao"><span>国贸集团</span></label>
            </div>
          </fieldset>
          <div class="field-heading"><label for="guest-name">受邀人 / 公司名称</label><span id="count">0 / 24</span></div>
          <input id="guest-name" name="guest" type="text" placeholder="例如：张先生、南果跨境" maxlength="48" autocomplete="off" spellcheck="false" aria-describedby="field-hint" autofocus>
          <p id="field-hint" class="field-hint">名称会自动显示在右侧邀请函中</p>
          <button id="save-button" type="submit" disabled>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>保存邀请函</span>
          </button>
          <p class="save-note">高清 PNG 图片 · 可保存后直接发送</p>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <div class="event-note"><span class="event-line"></span><div>满洲里市满欧快递类海关监管作业场所试运营仪式<small>2026年11月12日 · 满洲里综保区内</small></div></div>
      </section>

      <section class="preview" aria-labelledby="preview-title">
        <div class="preview-heading"><h2 id="preview-title">邀请函预览</h2><span><i></i>实时更新</span></div>
        <div class="paper"><canvas id="invitation" width="841" height="1870" role="img" aria-label="邀请函预览，填写名称后将实时更新"></canvas><div id="loading" class="loading">正在载入邀请函…</div></div>
        <p id="template-note" class="preview-note">国欧物流 · 预览即保存效果</p>
      </section>
    </main>
    <footer><span id="issuer-footer">国欧物流</span><span>诚邀莅临 · 共启新程</span></footer>
  </div>

  <dialog id="save-dialog" aria-labelledby="save-title">
    <div class="dialog-header"><div><h2 id="save-title">邀请函已生成</h2><p>长按下方图片，选择「保存图片」</p></div><button id="close-dialog" type="button" aria-label="关闭">×</button></div>
    <img id="save-image" alt="已生成的专属邀请函，可长按保存">
  </dialog>
  <script src="./templates-v3.js" defer></script>
  <script src="./app-v3.js" defer></script>
</body>
</html>
